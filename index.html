<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Africa Live Weather — 12 stations, 9 provinces</title>
<meta name="description" content="Live weather for 12 South African stations across all 9 provinces: current temperature, feels-like, humidity, wind, UV, 24-hour trend and a 7-day forecast. Free, open data from Open-Meteo.">
<meta name="theme-color" content="#06080f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)">
<link rel="canonical" href="https://south-africa-weather.amitka.workers.dev/">

<meta property="og:type" content="website">
<meta property="og:title" content="South Africa Live Weather">
<meta property="og:description" content="Live conditions and 7-day forecasts for 12 stations across all 9 South African provinces.">
<meta property="og:url" content="https://south-africa-weather.amitka.workers.dev/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">

<!-- Apply the saved theme before first paint so light-theme users see no dark flash. -->
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem("saw:theme") ||
      (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (e) { /* storage blocked — the markup default stands */ }
</script>
</head>
<body>

<!-- Icon sprite: every weather and UI glyph on the page is drawn from here. -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.8 6.8 0 0 0 11.1 11.1z"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.6 19h10.6a4 4 0 0 0 .5-8 5.9 5.9 0 0 0-11.3 1.3 3.4 3.4 0 0 0 .2 6.7z"/></symbol>
    <symbol id="i-cloud-sun" viewBox="0 0 24 24"><circle cx="8" cy="7.4" r="3"/><path d="M8 1.6v1.6M2.2 7.4h1.6M3.9 3.3l1.1 1.1M12.1 3.3 11 4.4"/><path d="M9.4 19.6h8.2a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-9.9 1 3 3 0 0 0 1.4 6.2z"/></symbol>
    <symbol id="i-cloud-moon" viewBox="0 0 24 24"><path d="M13.6 8.6A5.2 5.2 0 0 1 7.4 2.4a4.1 4.1 0 1 0 6.2 6.2z"/><path d="M9.4 20.1h8.2a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-9.9 1 3 3 0 0 0 1.4 6.2z"/></symbol>
    <symbol id="i-fog" viewBox="0 0 24 24"><path d="M6.6 14.4h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.7a3.4 3.4 0 0 0 .2 6.7z"/><path d="M4 18h9M15.5 18h4.5M7 21h10"/></symbol>
    <symbol id="i-drizzle" viewBox="0 0 24 24"><path d="M6.6 14.6h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.9a3.4 3.4 0 0 0 .2 6.7z"/><path d="M9 18v1.6M14.8 18v1.6M11.9 19v1.6"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6.6 14.2h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.5a3.4 3.4 0 0 0 .2 6.7z"/><path d="M8.4 17.4 7.2 21M12 17.4 10.8 21M15.6 17.4 14.4 21"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M6.6 14.2h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.5a3.4 3.4 0 0 0 .2 6.7z"/><path d="M8.6 18.4h.01M12 20.2h.01M15.4 18.4h.01M12 17h.01"/></symbol>
    <symbol id="i-sleet" viewBox="0 0 24 24"><path d="M6.6 14.2h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.5a3.4 3.4 0 0 0 .2 6.7z"/><path d="M8.8 17.4 7.6 21M15.2 18.4h.01M12 20h.01"/></symbol>
    <symbol id="i-thunder" viewBox="0 0 24 24"><path d="M6.6 13.8h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 7.1a3.4 3.4 0 0 0 .2 6.7z"/><path d="M13.4 16.2 10 17.9h2.6L11.4 21.6l3.6-4h-2.4z"/></symbol>

    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7 6.9 8.4a7 7 0 1 0 10.2 0z"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14.5 15.5 11"/><path d="M3.5 18a9.5 9.5 0 1 1 17 0"/></symbol>
    <symbol id="i-uv" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.9-6.4"/><path d="M20.8 4.2v5h-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21.5 20H2.5z"/><path d="M12 9.5v4.5M12 17h.01"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-6"/></symbol>
    <symbol id="i-cloudcover" viewBox="0 0 24 24"><path d="M6.6 17.5h10.6a4 4 0 0 0 .5-8A5.9 5.9 0 0 0 6.4 10.8a3.4 3.4 0 0 0 .2 6.7z"/></symbol>
  </defs>
</svg>

<div class="page">

  <header class="masthead">
    <div class="brand">
      <svg class="flag" viewBox="0 0 36 24" role="img" aria-label="Flag of South Africa">
        <clipPath id="flagClip"><rect width="36" height="24" rx="3"/></clipPath>
        <g clip-path="url(#flagClip)">
          <rect width="36" height="12" fill="#e03c31"/>
          <rect y="12" width="36" height="12" fill="#001489"/>
          <path d="M-3 -3 15 12H38" fill="none" stroke="#fff" stroke-width="8.4"/>
          <path d="M-3 27 15 12" fill="none" stroke="#fff" stroke-width="8.4"/>
          <path d="M-3 -3 15 12H38" fill="none" stroke="#007a4d" stroke-width="4.4"/>
          <path d="M-3 27 15 12" fill="none" stroke="#007a4d" stroke-width="4.4"/>
          <path d="M-1 0 13.4 12-1 24z" fill="#ffb612"/>
          <path d="M-1 3.4 9.4 12-1 20.6z" fill="#000"/>
        </g>
      </svg>
      <div class="brand-text">
        <h1>South&nbsp;Africa Live Weather</h1>
        <p>12 stations · all 9 provinces · refreshed straight from Open-Meteo in your browser</p>
      </div>
    </div>

    <div class="toolbar">
      <p class="status" id="status" role="status" aria-live="polite">
        <span class="dot" id="statusDot"></span><span id="statusText">Loading…</span>
      </p>
      <div class="btn-group" role="group" aria-label="Display options">
        <button type="button" class="btn btn-unit" id="unitBtn" aria-label="Switch to Fahrenheit">
          <span id="unitLabel">°C</span>
        </button>
        <button type="button" class="btn" id="themeBtn" aria-label="Switch to light theme">
          <svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button type="button" class="btn" id="refreshBtn" aria-label="Refresh weather data now">
          <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="alert" id="alert" role="alert" hidden>
    <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
    <span id="alertText"></span>
  </div>

  <noscript>
    <div class="alert alert-static">
      <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
      <span>This dashboard renders live data with JavaScript. The latest snapshot is always
      readable as plain JSON at <a href="data/weather.json">data/weather.json</a>.</span>
    </div>
  </noscript>

  <section class="summary" id="summary" aria-label="National summary">
    <div class="tile is-loading"></div><div class="tile is-loading"></div>
    <div class="tile is-loading"></div><div class="tile is-loading"></div>
  </section>

  <section class="controls" aria-label="Filter and sort stations">
    <div class="field field-search">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="search" placeholder="Filter by city or province…"
             autocomplete="off" aria-label="Filter stations by city or province">
    </div>
    <div class="field field-select">
      <label class="sr-only" for="sort">Sort stations</label>
      <select id="sort">
        <option value="temp-desc">Warmest first</option>
        <option value="temp-asc">Coolest first</option>
        <option value="wind-desc">Windiest first</option>
        <option value="rain-desc">Highest rain chance</option>
        <option value="name-asc">City A–Z</option>
        <option value="province-asc">Province A–Z</option>
      </select>
      <svg class="ico chev" aria-hidden="true"><use href="#i-chevron"/></svg>
    </div>
    <p class="result-count" id="resultCount" aria-live="polite"></p>
  </section>

  <section class="grid" id="grid" aria-label="Weather stations"></section>

  <section class="panel" aria-labelledby="compareTitle">
    <h2 id="compareTitle" class="panel-title">
      <svg class="ico" aria-hidden="true"><use href="#i-bars"/></svg>
      Temperature right now, station by station
    </h2>
    <div class="compare" id="compare"></div>
  </section>

  <footer class="footer">
    <p>
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      (CC BY 4.0) · fallback snapshot published by GitHub Actions ·
      <a href="https://github.com/amitka2222/south-africa-weather" target="_blank" rel="noopener">source on GitHub</a>
      · <a href="data/weather.json">raw JSON</a>
    </p>
    <p class="muted" id="footerStamp"></p>
  </footer>
</div>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "South Africa Live Weather",
  "url": "https://south-africa-weather.amitka.workers.dev/",
  "description": "Live weather and 7-day forecasts for 12 stations across all 9 South African provinces."
}
</script>
<script src="assets/app.js" defer></script>
</body>
</html>
