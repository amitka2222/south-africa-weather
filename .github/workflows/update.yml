name: Update weather snapshot

# The browser fetches live data on every visit, so this job only refreshes the
# committed fallback snapshot used for first paint and for when Open-Meteo is
# unreachable. Every 3 hours is plenty.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let a delayed run overlap the next scheduled one and race the push.
concurrency:
  group: weather-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Open-Meteo snapshot
        run: python fetch_data.py

      - name: Commit and push if the snapshot changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh weather snapshot [skip ci]"
          # Rebase in case a manual commit landed while this job was running.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
